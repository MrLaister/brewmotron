name: Brewmotron Testing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering

env:
  PYTHONUNBUFFERED: 1
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  # =============================================================================
  # Code Quality Checks
  # =============================================================================
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
    
    - name: Run Black code formatter check
      run: |
        black --check --diff --color .
    
    - name: Run isort import sorting check
      run: |
        isort --check-only --diff .
    
    - name: Run flake8 linting
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run mypy type checking
      run: |
        mypy . --ignore-missing-imports --python-version=3.9
      continue-on-error: true  # Type checking is advisory for now

  # =============================================================================
  # Unit Tests
  # =============================================================================
  test:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04]
        python-version: ["3.9", "3.10", "3.11"]
        exclude:
          # Reduce matrix size for faster CI
          - os: ubuntu-22.04
            python-version: "3.9"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-pip-
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgpiod2 \
          python3-dev \
          build-essential
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ \
          --verbose \
          --tb=short \
          --cov=tests/unit \
          --cov-report=xml \
          --cov-report=term-missing \
          --cov-fail-under=70 \
          -m "not slow and not integration"
    
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-22.04'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # =============================================================================
  # Integration Tests
  # =============================================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-integration-${{ hashFiles('**/requirements-test.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-integration-
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ \
          --verbose \
          --tb=short \
          --cov=tests/integration \
          --cov-report=xml \
          --cov-report=term-missing \
          -m "integration"
    
    - name: Upload integration test coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: integration
        name: codecov-integration
        fail_ci_if_error: false

  # =============================================================================
  # Hardware Simulation Tests
  # =============================================================================
  hardware-test:
    name: Hardware Simulation Tests
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
    
    - name: Run hardware simulation tests
      run: |
        pytest tests/ \
          --verbose \
          --tb=short \
          -m "hardware" \
          --timeout=300
    
    - name: Generate hardware test report
      if: always()
      run: |
        pytest tests/ \
          -m "hardware" \
          --html=hardware-test-report.html \
          --self-contained-html
      continue-on-error: true
    
    - name: Upload hardware test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hardware-test-report
        path: hardware-test-report.html

  # =============================================================================
  # Performance Tests
  # =============================================================================
  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
    
    - name: Run performance tests
      run: |
        pytest tests/ \
          --verbose \
          --tb=short \
          -m "slow" \
          --timeout=600 \
          --benchmark-only \
          --benchmark-json=performance-results.json
      continue-on-error: true
    
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: performance-results.json

  # =============================================================================
  # Security Scanning
  # =============================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Run safety check for known vulnerabilities
      run: |
        safety check --json --output safety-report.json
      continue-on-error: true
    
    - name: Run bandit security linter
      run: |
        bandit -r . -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json

  # =============================================================================
  # Documentation Tests
  # =============================================================================
  docs-test:
    name: Documentation Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt
        pip install sphinx sphinx-rtd-theme
    
    - name: Test docstring coverage
      run: |
        python -c "
        import ast
        import os
        
        def count_docstrings(directory):
            total_functions = 0
            documented_functions = 0
            
            for root, dirs, files in os.walk(directory):
                for file in files:
                    if file.endswith('.py'):
                        filepath = os.path.join(root, file)
                        try:
                            with open(filepath, 'r') as f:
                                tree = ast.parse(f.read())
                            
                            for node in ast.walk(tree):
                                if isinstance(node, (ast.FunctionDef, ast.ClassDef)):
                                    total_functions += 1
                                    if ast.get_docstring(node):
                                        documented_functions += 1
                        except:
                            continue  # Skip files that can't be parsed
            
            return documented_functions, total_functions
        
        documented, total = count_docstrings('.')
        coverage = (documented / total * 100) if total > 0 else 0
        print(f'Docstring coverage: {documented}/{total} ({coverage:.1f}%)')
        
        if coverage < 50:
            print('Warning: Docstring coverage below 50%')
        "
    
    - name: Validate README and documentation
      run: |
        # Check that README exists and has minimum content
        if [ ! -f "README.md" ]; then
          echo "Error: README.md not found"
          exit 1
        fi
        
        # Check README has minimum length
        if [ $(wc -w < README.md) -lt 100 ]; then
          echo "Warning: README.md seems too short"
        fi
        
        echo "Documentation validation completed"

  # =============================================================================
  # Build and Package Test
  # =============================================================================
  build-test:
    name: Build and Package Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Test package builds
      run: |
        # Test building each plugin package
        for plugin_dir in cbpi4-*; do
          if [ -d "$plugin_dir" ] && [ -f "$plugin_dir/setup.py" ]; then
            echo "Testing build for $plugin_dir"
            cd "$plugin_dir"
            python -m build --wheel --outdir ../dist/
            cd ..
          fi
        done
    
    - name: Validate built packages
      run: |
        # Check that wheels were created
        if [ ! -d "dist" ] || [ -z "$(ls -A dist/)" ]; then
          echo "Error: No packages were built"
          exit 1
        fi
        
        # Validate package metadata
        for wheel in dist/*.whl; do
          if [ -f "$wheel" ]; then
            echo "Validating $wheel"
            twine check "$wheel"
          fi
        done
    
    - name: Upload built packages
      uses: actions/upload-artifact@v4
      with:
        name: built-packages
        path: dist/

  # =============================================================================
  # Test Results Summary
  # =============================================================================
  test-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [lint, test, integration-test, hardware-test, security, docs-test, build-test]
    if: always()
    
    steps:
    - name: Generate test summary
      run: |
        echo "# Brewmotron Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Job Status" >> $GITHUB_STEP_SUMMARY
        echo "- Code Quality: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Unit Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Integration Tests: ${{ needs.integration-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Hardware Tests: ${{ needs.hardware-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security Scan: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Documentation: ${{ needs.docs-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Test: ${{ needs.build-test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Overall status
        if [[ "${{ needs.lint.result }}" == "success" && \
              "${{ needs.test.result }}" == "success" && \
              "${{ needs.integration-test.result }}" == "success" && \
              "${{ needs.hardware-test.result }}" == "success" && \
              "${{ needs.build-test.result }}" == "success" ]]; then
          echo "## ✅ Overall Status: PASS" >> $GITHUB_STEP_SUMMARY
          echo "All critical tests passed successfully!" >> $GITHUB_STEP_SUMMARY
        else
          echo "## ❌ Overall Status: FAIL" >> $GITHUB_STEP_SUMMARY
          echo "One or more critical tests failed. Please review the results above." >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Generated on: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY