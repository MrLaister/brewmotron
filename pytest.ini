[tool:pytest]
import-mode=importlib
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --cov=cbpi4-7SegDisplay
    --cov=cbpi4-LCDisplay
    --cov=cbpi4-i2cTempSensor
    --cov=cbpi4-GPIOInput
    --cov=cbpi4-AlwaysONGPIO
    --cov=cbpi4-BMT-Key
    --cov=cbpi4-BMT-MomentaryButtons
    --cov=cbpi4-InternetConnectedGPIO
    --cov=cbpi4-OneAtATime
    --cov=cbpi4-NOR3
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70
    --asyncio-mode=auto
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    hardware: marks tests that require hardware simulation
    integration: marks integration tests
    unit: marks unit tests
    i2c: marks tests involving I2C hardware interfaces
    gpio: marks tests involving GPIO interfaces
    network: marks tests requiring network connectivity
    timeout: marks tests with custom timeout values
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:RPi.*
    ignore::UserWarning:smbus.*
asyncio_mode = auto