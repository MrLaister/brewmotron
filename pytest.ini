[pytest]
import-mode=importlib
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# PHASE 1: During cache handler integration, only measure cache handler coverage
# Plugin tests are marked with @pytest.mark.skip() but still collected
# Coverage configured via .coveragerc to focus on brewmotron_cache_handler only
addopts =
    --strict-markers
    --strict-config
    --verbose
    --cov=brewmotron_cache_handler
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70
    --asyncio-mode=auto
    --timeout=10
    --timeout-method=thread
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    hardware: marks tests that require hardware simulation
    integration: marks integration tests
    unit: marks unit tests
    i2c: marks tests involving I2C hardware interfaces
    gpio: marks tests involving GPIO interfaces
    network: marks tests requiring network connectivity
    timeout: marks tests with custom timeout values
    manual: marks tests requiring manual execution (e.g., installed plugins) - skipped in CI
    real_plugin: marks tests that test real plugin code (not mocks)
    requires_hardware_mock: marks tests requiring hardware mocking
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:RPi.*
    ignore::UserWarning:smbus.*
asyncio_mode = auto